[workspace]
members = [
    "crates/sdkwork-discovery-database-host",
    "crates/sdkwork-discovery-contract",
    "crates/sdkwork-discovery-config",
    "crates/sdkwork-discovery-health-checker",
    "crates/sdkwork-discovery-storage-contract",
    "crates/sdkwork-discovery-storage-memory",
    "crates/sdkwork-discovery-storage-postgres",
    "crates/sdkwork-discovery-storage-redis",
    "crates/sdkwork-discovery-storage-sqlite",
    "crates/sdkwork-discovery-core",
    "crates/sdkwork-discovery-rpc-proto",
    "crates/sdkwork-discovery-rpc",
    "services/sdkwork-discovery-service-host",
    "xtask/sdkwork-discovery-standards",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "tls-rustls-ring-native-roots"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uuid = { version = "1.18", features = ["v7"] }
redis = { version = "0.27", features = ["tokio-comp"] }

sdkwork-discovery-database-host = { path = "crates/sdkwork-discovery-database-host" }
sdkwork-discovery-config = { path = "crates/sdkwork-discovery-config" }
sdkwork-discovery-contract = { path = "crates/sdkwork-discovery-contract" }
sdkwork-discovery-health-checker = { path = "crates/sdkwork-discovery-health-checker" }
sdkwork-discovery-core = { path = "crates/sdkwork-discovery-core" }
sdkwork-discovery-rpc = { path = "crates/sdkwork-discovery-rpc" }
sdkwork-discovery-rpc-proto = { path = "crates/sdkwork-discovery-rpc-proto" }
sdkwork-discovery-storage-contract = { path = "crates/sdkwork-discovery-storage-contract" }
sdkwork-discovery-storage-memory = { path = "crates/sdkwork-discovery-storage-memory" }
sdkwork-discovery-storage-postgres = { path = "crates/sdkwork-discovery-storage-postgres" }
sdkwork-discovery-storage-redis = { path = "crates/sdkwork-discovery-storage-redis" }
sdkwork-discovery-storage-sqlite = { path = "crates/sdkwork-discovery-storage-sqlite" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork_database_config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork_database_lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork_database_spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork_database_sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap", package = "sdkwork-web-bootstrap" }
