syntax = "proto3";

package sdkwork.discovery.common.v1;

import "google/protobuf/timestamp.proto";

message ResponseMetadata {
  string request_id = 1;
  string trace_id = 2;
  google.protobuf.Timestamp server_time = 3;
  uint64 revision = 4;
}

message ServiceInstance {
  string namespace = 1;
  string environment = 2;
  string service_name = 3;
  string instance_id = 4;
  string endpoint = 5;
  string protocol = 6;
  string version = 7;
  string region = 8;
  string zone = 9;
  uint32 weight = 10;
  uint32 priority = 11;
  InstanceStatus status = 12;
  map<string, string> metadata = 13;
  string lease_id = 14;
  google.protobuf.Timestamp expires_at = 15;
  uint64 revision = 16;
  optional HealthCheckConfig health_check = 17;
}

message ServiceSummary {
  string namespace = 1;
  string environment = 2;
  string service_name = 3;
  uint64 active_instance_count = 4;
  uint64 latest_revision = 5;
}

enum InstanceStatus {
  INSTANCE_STATUS_UNSPECIFIED = 0;
  INSTANCE_STATUS_SERVING = 1;
  INSTANCE_STATUS_DEGRADED = 2;
  INSTANCE_STATUS_NOT_SERVING = 3;
}

message ConfigValue {
  string key = 1;
  string value = 2;
  ConfigFormat format = 3;
  string source_release_id = 4;
  uint32 source_specificity = 5;
  uint64 source_revision = 6;
}

enum ConfigFormat {
  CONFIG_FORMAT_UNSPECIFIED = 0;
  CONFIG_FORMAT_TEXT = 1;
  CONFIG_FORMAT_JSON = 2;
  CONFIG_FORMAT_TOML = 3;
}

enum ConfigScopeType {
  CONFIG_SCOPE_TYPE_UNSPECIFIED = 0;
  CONFIG_SCOPE_TYPE_NAMESPACE = 1;
  CONFIG_SCOPE_TYPE_APPLICATION = 2;
  CONFIG_SCOPE_TYPE_SERVICE = 3;
}

message ConfigRelease {
  string release_id = 1;
  string draft_id = 2;
  string namespace = 3;
  string environment = 4;
  string group = 5;
  string key = 6;
  ConfigFormat format = 7;
  string value = 8;
  ConfigScopeType scope_type = 9;
  string application = 10;
  string service_name = 11;
  string content_hash = 12;
  string published_by = 13;
  google.protobuf.Timestamp published_at = 14;
  uint64 revision = 15;
}

message LabelFilter {
  string key = 1;
  LabelFilterOp op = 2;
  string value = 3;
}

message BatchOperationError {
  uint32 index = 1;
  string error_code = 2;
  string error_message = 3;
}

enum LabelFilterOp {
  LABEL_FILTER_OP_UNSPECIFIED = 0;
  LABEL_FILTER_OP_EQ = 1;
  LABEL_FILTER_OP_NOT_EQ = 2;
  LABEL_FILTER_OP_IN = 3;
  LABEL_FILTER_OP_EXISTS = 4;
}

enum DiscoverSortBy {
  DISCOVER_SORT_BY_UNSPECIFIED = 0;
  DISCOVER_SORT_BY_INSTANCE_ID = 1;
  DISCOVER_SORT_BY_PRIORITY = 2;
  DISCOVER_SORT_BY_WEIGHT = 3;
  DISCOVER_SORT_BY_WEIGHTED_RANDOM = 4;
}

enum HealthCheckProbeKind {
  HEALTH_CHECK_PROBE_KIND_UNSPECIFIED = 0;
  HEALTH_CHECK_PROBE_KIND_TCP = 1;
  HEALTH_CHECK_PROBE_KIND_HTTP = 2;
  HEALTH_CHECK_PROBE_KIND_GRPC = 3;
}

message HealthCheckProbe {
  HealthCheckProbeKind kind = 1;
  string http_path = 2;
  uint32 http_expected_status = 3;
  string grpc_service_name = 4;
}

message HealthCheckConfig {
  HealthCheckProbe probe = 1;
  uint64 interval_ms = 2;
  uint64 timeout_ms = 3;
  uint32 unhealthy_threshold = 4;
  uint32 healthy_threshold = 5;
}

enum WatchEventType {
  WATCH_EVENT_TYPE_UNSPECIFIED = 0;
  WATCH_EVENT_TYPE_INSTANCE_REGISTERED = 1;
  WATCH_EVENT_TYPE_INSTANCE_UPDATED = 2;
  WATCH_EVENT_TYPE_INSTANCE_STATUS_REPORTED = 3;
  WATCH_EVENT_TYPE_INSTANCE_RENEWED = 4;
  WATCH_EVENT_TYPE_INSTANCE_DEREGISTERED = 5;
  WATCH_EVENT_TYPE_CONFIG_PUBLISHED = 6;
  WATCH_EVENT_TYPE_CONFIG_ROLLED_BACK = 7;
  WATCH_EVENT_TYPE_HEARTBEAT = 8;
}
