[runtime]
environment = "development"
config_profile = "dev"
deployment_profile = "standalone"
deployment_mode = "server"
runtime_target = "server"

[server]
grpc_bind_host = "127.0.0.1"
grpc_port = 19090
admin_grpc_port = 19091
enable_health = true
# Local/private development can enable reflection. Production config must keep
# reflection disabled unless a governed access-control layer protects it.
enable_reflection = true
# Applied as the default tonic server request timeout. Long-lived watch clients
# should handle cancellation/deadline and reconnect with the latest revision.
default_deadline_ms = 5000

[security]
# Supported value: service-token. Protected RPC calls require SDKWork
# authorization + access-token metadata; unsigned caller context is only a
# local development/test convenience.
auth_mode = "service-token"
tls_enabled = false
mtls_enabled = false
# Allowed only for development/test runtimes bound to loopback. Production and
# staging config must set this to false or override it with
# SDKWORK_DISCOVERY_RPC_ALLOW_UNSIGNED_LOCAL_CONTEXT=false.
allow_unsigned_local_context = true
# Required when allow_unsigned_local_context is false. The file must contain at
# least 32 bytes of secret material; startup trims trailing whitespace and never
# logs the secret value. Signed service tokens carry subject and permission
# claims and bind the access-token metadata by SHA-256 hash.
# [security.service_token]
# hmac_secret_file = "/run/secrets/sdkwork/discovery/service-token-hmac.secret"
# issuer = "sdkwork-discovery"
# audience = "sdkwork-discovery-rpc"
# max_token_ttl_seconds = 3600
# TLS and mTLS use secret-file references only. Do not place PEM contents here.
# server_tls_cert_file = "/run/secrets/sdkwork/discovery/server.crt"
# server_tls_key_file = "/run/secrets/sdkwork/discovery/server.key"
# client_ca_cert_file = "/run/secrets/sdkwork/discovery/client-ca.crt"

[storage]
provider = "memory"
registry_role = "primary"
config_role = "primary"
watch_role = "primary"

# Durable storage providers are configured with structured fields and secret-file references.
# PostgreSQL and SQLite can also be supplied through the canonical
# SDKWORK_DISCOVERY_DATABASE_* env overlay. Direct password env values are rejected;
# use SDKWORK_DISCOVERY_DATABASE_PASSWORD_FILE or provider-specific *_PASSWORD_FILE keys.
# PostgreSQL durable adapter support is available for production registry, config, and watch storage.
# Apply database/migrations/postgres through sdkwork-database (pnpm db:migrate) or your deployment
# pipeline before serving traffic with provider = "postgres".
#
# [storage.postgres]
# host = "postgres.internal"
# port = 5432
# database = "sdkwork_discovery"
# schema = "public"
# username = "sdkwork_discovery"
# password_file = "/run/secrets/sdkwork/discovery/postgres-password"
# tls_enabled = true
# connect_timeout_ms = 3000
# max_connections = 32
#
# SQLite durable adapter support is available for local/test/small single-node deployments.
# Production server/container config rejects provider = "sqlite".
# Apply database/migrations/sqlite through sdkwork-database (pnpm db:migrate) before serving traffic,
# or set apply_initial_schema = true only outside production.
#
# [storage.sqlite]
# file = "target/dev/discovery/discovery.sqlite"
# max_connections = 1
#
# [storage.redis]
# host = "redis.internal"
# port = 6379
# database = "0"
# username = "sdkwork_discovery"
# password_file = "/run/secrets/sdkwork/discovery/redis-password"
# tls_enabled = true
# connect_timeout_ms = 3000
# max_connections = 32
#
# [storage.etcd]
# host = "etcd.internal"
# port = 2379
# username = "sdkwork_discovery"
# password_file = "/run/secrets/sdkwork/discovery/etcd-password"
# tls_enabled = true
# connect_timeout_ms = 3000
# max_connections = 16
#
# [storage.consul]
# host = "consul.internal"
# port = 8500
# username = "sdkwork_discovery"
# password_file = "/run/secrets/sdkwork/discovery/consul-token"
# tls_enabled = true
# connect_timeout_ms = 3000
# max_connections = 16

[registry]
default_lease_ttl_seconds = 30
min_lease_ttl_seconds = 5
max_lease_ttl_seconds = 300
# Bounds one background expiry scan iteration so large fleets cannot monopolize
# the runtime actor or database transaction.
expiry_scan_interval_ms = 1000
expiry_scan_batch_size = 1000

[config_registry]
enabled = true
max_config_body_bytes = 262144
require_publish_for_reads = true
allow_secret_values = false
allow_secret_refs = true

[watch]
enabled = true
# Watch streams replay durable stored events from from_revision, receive
# same-process live signals for low latency, and poll durable watch storage for
# updates written by other runtime processes that share the same provider.
# max_streams caps concurrent Watch streams; excess clients receive
# ResourceExhausted. event_buffer_size bounds each server-side stream queue.
# heartbeat_interval_ms emits idle heartbeat events with the last delivered
# revision so clients can keep the stream and reconnect cursor healthy.
# durable_poll_interval_ms polls durable storage for changes written by other
# runtime processes that do not share this process' live watch broadcaster.
# durable_replay_batch_size limits each durable replay query so slow consumers
# catch up in bounded batches instead of loading unbounded event history.
max_streams = 10000
event_buffer_size = 1024
heartbeat_interval_ms = 15000
durable_poll_interval_ms = 1000
durable_replay_batch_size = 1000
# event_gc_interval_ms = 0 disables background watch event GC.
# event_gc_retention_count keeps the newest N revisions; event_gc_batch_size bounds each delete pass.
# event_gc_interval_ms = 60000
# event_gc_retention_count = 10000
# event_gc_batch_size = 1000

[resilience]
# All resilience features are disabled by default. Enable only when the runtime actor
# needs request throttling, storage circuit breaking, or read-only degradation.
# [resilience.circuit_breaker]
# enabled = false
# failure_threshold = 5
# recovery_timeout_ms = 30000
# half_open_max_requests = 3
# [resilience.rate_limit]
# enabled = false
# requests_per_second = 1000
# burst_capacity = 1000
# [resilience.degradation]
# read_only_on_storage_failure = false
# stale_read_max_age_ms = 60000
