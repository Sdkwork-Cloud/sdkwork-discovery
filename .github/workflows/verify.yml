name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling SDKWork dependencies
        run: |
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-specs.git "${GITHUB_WORKSPACE}/../sdkwork-specs"
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-app-topology.git "${GITHUB_WORKSPACE}/../sdkwork-app-topology"
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-database.git "${GITHUB_WORKSPACE}/../sdkwork-database"
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-web-framework.git "${GITHUB_WORKSPACE}/../sdkwork-web-framework"
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-utils.git "${GITHUB_WORKSPACE}/../sdkwork-utils"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install

      - name: Run repository verification
        run: pnpm run verify

  package-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling SDKWork dependencies
        run: |
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-specs.git "${GITHUB_WORKSPACE}/../sdkwork-specs"
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-app-topology.git "${GITHUB_WORKSPACE}/../sdkwork-app-topology"
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-database.git "${GITHUB_WORKSPACE}/../sdkwork-database"
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-web-framework.git "${GITHUB_WORKSPACE}/../sdkwork-web-framework"
          git clone --depth 1 https://github.com/Sdkwork-Cloud/sdkwork-utils.git "${GITHUB_WORKSPACE}/../sdkwork-utils"

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install

      - name: Build and validate server release package
        run: |
          pnpm run release:package
          pnpm run release:validate
